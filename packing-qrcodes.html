<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>包貨紙箱 QR Code</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#eef2f5; color:#101820; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif; }
    .page { max-width:900px; margin:0 auto; padding:28px; }
    h1 { margin:0 0 6px; font-size:28px; } p { margin:0 0 24px; color:#526273; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .card { display:flex; flex-direction:column; align-items:center; gap:12px; padding:22px 14px; border:1px solid #c8d2dc; border-radius:8px; background:#fff; }
    .code { width:180px; height:180px; }.model { font-size:30px; font-weight:800; }.description { font-size:17px; color:#526273; }
    @media print { body { background:#fff; }.page { max-width:none; padding:8mm; }h1,p { display:none; }.grid { gap:7mm; }.card { break-inside:avoid; border-color:#333; }.code { width:42mm; height:42mm; } }
    @media(max-width:620px) { .grid { grid-template-columns:repeat(2,1fr); }.code { width:140px; height:140px; } }
  </style>
</head>
<body>
  <main class="page">
    <h1>包貨紙箱 QR Code</h1>
    <p>列印後貼在各紙箱作業區。掃描內容只包含紙箱型號。</p>
    <section id="grid" class="grid"></section>
  </main>
  <script>
    const boxes = [
      ["S60", "S60 包裝籍"],
      ["S77", "S77 包裝箱"],
      ["S105", "S105 包裝箱"],
      ["S120", "S120 包裝箱"],
      ["S150", "S150 包裝箱"]
    ];
    const grid = document.getElementById("grid");
    boxes.forEach(([model, label]) => {
      const card = document.createElement("article");
      card.className = "card";
      const code = document.createElement("div");
      code.className = "code";
      const modelEl = document.createElement("div");
      modelEl.className = "model";
      modelEl.textContent = model;
      const text = document.createElement("div");
      text.className = "description";
      text.textContent = label;
      card.append(code, modelEl, text);
      grid.append(card);
      new QRCode(code, { text:model, width:180, height:180, colorDark:"#000000", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.H });
    });
  </script>
</body>
</html>
